<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenprint</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0c0c0f;
    --surface: #111116;
    --border: #1e1e28;
    --accent: #C504A5;
    --text: #e8e8e8;
    --muted: #555566;
    --dim: #2a2a38;
    --preview-bg: #000;
  }

  body.light {
    --bg: #efefec;
    --surface: #e8e8e4;
    --border: #d0d0c8;
    --text: #1a1a2a;
    --muted: #888899;
    --dim: #c8c8c0;
    --preview-bg: #efefec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto 1fr auto;
  }

  /* Header */
  header {
    grid-column: 1 / -1;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header p {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-ghost {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--dim);
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

  .btn-export {
    padding: 8px 18px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: rgba(197,4,165,0.1);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0.35;
    pointer-events: none;
  }
  .btn-export.ready {
    opacity: 1;
    pointer-events: auto;
  }
  .btn-export.ready:hover {
    background: rgba(197,4,165,0.22);
    box-shadow: 0 0 18px rgba(197,4,165,0.2);
  }
  .btn-export.ready:active {
    background: rgba(197,4,165,0.3);
  }

  .btn-export svg {
    width: 12px; height: 12px;
    flex-shrink: 0;
  }

  /* Controls panel */
  .controls {
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow-y: auto;
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .dropzone {
    border: 1px dashed var(--dim);
    border-radius: 8px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: var(--surface);
  }
  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: rgba(197,4,165,0.04); }
  .dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.6; }
  .dropzone p { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .dropzone strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }

  .file-loaded {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    margin-top: 8px;
    word-break: break-all;
    display: none;
  }

  .slider-group { display: flex; flex-direction: column; gap: 14px; }

  .slider-item label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }
  .slider-item label .val { color: var(--text); font-size: 11px; }
  .slider-item input[type=range] {
    width: 100%; height: 2px; -webkit-appearance: none;
    background: var(--dim); border-radius: 1px; outline: none; cursor: pointer;
  }
  .slider-item input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform 0.15s;
  }
  .slider-item input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .color-group { display: flex; flex-direction: column; gap: 10px; }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row label { font-size: 11px; font-family: 'Space Mono', monospace; color: #888; flex: 1; line-height: 1.3; }
  .color-row label span { display: block; font-size: 9px; color: var(--muted); margin-top: 1px; }
  .color-row input[type=color] { width: 32px; height: 24px; border: 1px solid var(--dim); border-radius: 4px; background: none; cursor: pointer; padding: 0; }

  .preset-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-btn {
    padding: 5px 10px; border-radius: 4px; font-size: 10px;
    font-family: 'Space Mono', monospace; cursor: pointer;
    border: 1px solid var(--dim); background: var(--surface); color: #888;
    transition: all 0.15s; letter-spacing: 0.05em;
  }
  .preset-btn:hover, .preset-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(197,4,165,0.06); }

  /* Preview */
  .preview-area {
    display: flex; align-items: center; justify-content: center;
    background: var(--preview-bg); position: relative; overflow: hidden;
  }
  .preview-area::before {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(197,4,165,0.03) 39px, rgba(197,4,165,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(197,4,165,0.03) 39px, rgba(197,4,165,0.03) 40px);
    pointer-events: none;
  }

  .canvas-wrap { position: relative; max-width: 90%; max-height: 90vh; }

  canvas { display: block; max-width: 100%; max-height: 80vh; border-radius: 4px; }

  .empty-state { text-align: center; pointer-events: none; }
  .empty-state .big { font-size: 48px; opacity: 0.15; margin-bottom: 12px; }
  .empty-state p { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }

  .status-bar {
    grid-column: 1 / -1; padding: 8px 32px;
    border-top: 1px solid var(--border);
    font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted);
    display: flex; gap: 24px; background: var(--surface);
  }
  .status-bar span { color: var(--text); }

  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
    pointer-events: none; border-radius: 4px; opacity: 0.5;
  }

  .glow-ring { position: absolute; inset: -2px; border-radius: 6px; box-shadow: 0 0 40px rgba(197,4,165,0.15), 0 0 80px rgba(197,4,165,0.06); pointer-events: none; display: none; }
  .glow-ring.active { display: block; }
</style>
</head>
<body class="light">

<header>
  <h1>Screenprint</h1>
  <p>// halftone · color map · live preview</p>
  <div class="header-actions">
    <button class="btn-ghost" id="bgToggle" onclick="toggleBg()">Dark BG</button>
    <button class="btn-export" id="exportBtn" onclick="exportImage()" title="Export file">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 1v7M3.5 5.5L6 8l2.5-2.5"/>
        <path d="M1.5 9.5v.5a.5.5 0 00.5.5h8a.5.5 0 00.5-.5v-.5"/>
      </svg>
      Export
    </button>
  </div>
</header>

<aside class="controls">

  <div>
    <p class="section-label">01 — Source</p>
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="video/*,image/*">
      <div class="dropzone-icon">⬡</div>
      <p><strong>Drop image or video</strong>jpg · png · webm · mp4</p>
    </div>
    <div class="file-loaded" id="fileLoaded">—</div>
  </div>

  <div>
    <p class="section-label">02 — Tone Preset</p>
    <div class="preset-row">
      <button class="preset-btn active" data-preset="magenta">Magenta</button>
      <button class="preset-btn" data-preset="cyan">Cyan</button>
      <button class="preset-btn" data-preset="amber">Amber</button>
      <button class="preset-btn" data-preset="ghost">Ghost</button>
      <button class="preset-btn" data-preset="custom">Custom</button>
    </div>
  </div>

  <div id="customColors">
    <p class="section-label">03 — Color Map</p>
    <div class="color-group">
      <div class="color-row">
        <label>Shadow tone<span>deep shadows</span></label>
        <input type="color" id="colShadow" value="#C504A5">
      </div>
      <div class="color-row">
        <label>Midtone<span>mid values</span></label>
        <input type="color" id="colMid" value="#F78AC8">
      </div>
      <div class="color-row">
        <label>Highlight tone<span>near-bright areas</span></label>
        <input type="color" id="colHighlight" value="#FDC8E4">
      </div>
    </div>
  </div>

  <div>
    <p class="section-label">04 — Halftone</p>
    <div class="slider-group">
      <div class="slider-item">
        <label>Dot Size <span class="val" id="vDotSize">4px</span></label>
        <input type="range" id="dotSize" min="2" max="16" step="0.5" value="4">
      </div>
      <div class="slider-item">
        <label>Grid Angle <span class="val" id="vAngle">20°</span></label>
        <input type="range" id="angle" min="0" max="90" step="1" value="20">
      </div>
      <div class="slider-item">
        <label>Brightness <span class="val" id="vBrightness">80%</span></label>
        <input type="range" id="brightness" min="20" max="200" step="1" value="80">
      </div>
      <div class="slider-item">
        <label>Contrast <span class="val" id="vContrast">150%</span></label>
        <input type="range" id="contrast" min="50" max="400" step="1" value="150">
      </div>
      <div class="slider-item">
        <label>Blur <span class="val" id="vBlur">2px</span></label>
        <input type="range" id="blur" min="0" max="10" step="0.5" value="2">
      </div>
      <div class="slider-item">
        <label>Cutoff (fade highlights) <span class="val" id="vCutoff">65%</span></label>
        <input type="range" id="cutoff" min="30" max="100" step="1" value="65">
      </div>
    </div>
  </div>

</aside>

<main class="preview-area" id="previewArea">
  <div class="empty-state" id="emptyState">
    <div class="big">⬡</div>
    <p>Drop a file to begin rendering</p>
  </div>
  <div class="canvas-wrap" id="canvasWrap" style="display:none">
    <canvas id="canvas"></canvas>
    <div class="scanlines"></div>
    <div class="glow-ring" id="glowRing"></div>
  </div>
</main>

<footer class="status-bar">
  <div>file <span id="statFile">—</span></div>
  <div>size <span id="statSize">—</span></div>
  <div>dots <span id="statDots">—</span></div>
  <div>preset <span id="statPreset">magenta</span></div>
</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const offA = document.createElement('canvas'), offB = document.createElement('canvas');
const ctxA = offA.getContext('2d'), ctxB = offB.getContext('2d');
const video = document.createElement('video');
video.loop = true; video.muted = true; video.playsInline = true;

let animFrame = null;
let sourceType = null;
let sourceImage = null;
let currentFileName = 'screenprint';
let sourceFile = null; // original File reference for non-image export

const PRESETS = {
  magenta: { shadow: '#C504A5', mid: '#F78AC8', highlight: '#FDC8E4' },
  cyan:    { shadow: '#04C5C5', mid: '#7AF0F0', highlight: '#C8FDFD' },
  amber:   { shadow: '#C56004', mid: '#F5C376', highlight: '#FDE8C8' },
  ghost:   { shadow: '#8888aa', mid: '#c0c0d8', highlight: '#e8e8f0' },
  custom:  null,
};

let currentPreset = 'magenta';

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function lerp(a,b,t) { return Math.round(a + (b-a)*t); }

function getColors() {
  if(currentPreset !== 'custom') return PRESETS[currentPreset];
  return {
    shadow:    document.getElementById('colShadow').value,
    mid:       document.getElementById('colMid').value,
    highlight: document.getElementById('colHighlight').value,
  };
}

function getParams() {
  const g = id => parseFloat(document.getElementById(id).value);
  return {
    dotSize:    g('dotSize'),
    angle:      g('angle') * Math.PI / 180,
    brightness: g('brightness') / 100,
    contrast:   g('contrast') / 100,
    blur:       g('blur'),
    cutoff:     g('cutoff') / 100,
  };
}

function getDotColor(lum, colors) {
  const { shadow, mid, highlight } = colors;
  const sRgb = hexToRgb(shadow);
  const mRgb = hexToRgb(mid);
  const hRgb = hexToRgb(highlight);
  const cutoff = getParams().cutoff;

  if(lum < 0.25) {
    return `rgb(${sRgb[0]},${sRgb[1]},${sRgb[2]})`;
  } else if(lum < 0.5) {
    const t = (lum - 0.25) / 0.25;
    return `rgb(${lerp(sRgb[0],mRgb[0],t)},${lerp(sRgb[1],mRgb[1],t)},${lerp(sRgb[2],mRgb[2],t)})`;
  } else if(lum < cutoff) {
    const t = (lum - 0.5) / (cutoff - 0.5);
    return `rgb(${lerp(mRgb[0],hRgb[0],t)},${lerp(mRgb[1],hRgb[1],t)},${lerp(mRgb[2],hRgb[2],t)})`;
  } else {
    return null;
  }
}

function renderSource(source, isVideo) {
  const { dotSize, angle, brightness, contrast, blur } = getParams();
  const W = canvas.width, H = canvas.height;
  offA.width = W; offA.height = H;
  offB.width = W; offB.height = H;

  ctxA.filter = `grayscale(1) brightness(${brightness}) contrast(${contrast})${blur > 0 ? ` blur(${blur}px)` : ''}`;
  ctxA.drawImage(source, 0, 0, W, H);
  ctxA.filter = 'none';

  if(isVideo) {
    ctxA.globalCompositeOperation = 'destination-in';
    ctxA.drawImage(source, 0, 0, W, H);
    ctxA.globalCompositeOperation = 'source-over';
  }

  const px = ctxA.getImageData(0, 0, W, H).data;
  ctxB.clearRect(0, 0, W, H);

  const colors = getColors();
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const diag = Math.sqrt(W*W + H*H);

  ctxB.save();
  ctxB.translate(W/2, H/2);

  let dotCount = 0;

  for(let gy = -diag; gy < diag; gy += dotSize) {
    for(let gx = -diag; gx < diag; gx += dotSize) {
      const cx = gx + dotSize/2, cy = gy + dotSize/2;
      const sx = Math.floor(cx*cos - cy*sin + W/2);
      const sy = Math.floor(cx*sin + cy*cos + H/2);
      if(sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      const idx = (sy*W + sx)*4;
      const lum = px[idx] / 255;
      const alpha = px[idx+3];
      if(alpha < 128) continue;
      const r = dotSize * 0.7 * (1 - lum);
      if(r < 0.8) continue;

      const dotColor = getDotColor(lum, colors);
      if(!dotColor) continue;

      const fadedR = r * Math.pow(alpha/255, 0.4);
      if(fadedR < 0.3) continue;

      ctxB.fillStyle = dotColor;
      ctxB.beginPath();
      ctxB.arc(cx, cy, fadedR, 0, Math.PI*2);
      ctxB.fill();
      dotCount++;
    }
  }

  ctxB.restore();
  ctx.clearRect(0, 0, W, H);
  if(document.body.classList.contains('light')) {
    ctx.fillStyle = '#efefec';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(offB, 0, 0);

  document.getElementById('statDots').textContent = dotCount.toLocaleString();
}

// ── Export ───────────────────────────────────────────────────────────
function exportImage() {
  if(!sourceFile) return;

  // Flash feedback
  const btn = document.getElementById('exportBtn');
  btn.style.background = 'rgba(197,4,165,0.3)';
  setTimeout(() => { btn.style.background = ''; }, 200);

  const link = document.createElement('a');

  if(sourceType === 'image') {
    // Export processed canvas as PNG, named with preset + dot size
    const baseName = currentFileName.replace(/\.[^/.]+$/, '');
    const dotVal   = document.getElementById('dotSize').value;
    link.download = `${baseName}_${currentPreset}_d${dotVal}.png`;
    link.href = canvas.toDataURL('image/png');
  } else {
    // Video or any other file — download the original file unchanged
    link.download = currentFileName;
    link.href = URL.createObjectURL(sourceFile);
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  }

  link.click();
}

function setExportReady(ready, label) {
  const btn = document.getElementById('exportBtn');
  btn.classList.toggle('ready', ready);
  if(label) {
    // Update the text node (last child after SVG)
    const textNode = Array.from(btn.childNodes).find(n => n.nodeType === 3 && n.textContent.trim());
    if(textNode) textNode.textContent = '\n      ' + label + '\n    ';
  }
}

// ── Load ─────────────────────────────────────────────────────────────
function startVideoLoop() {
  if(animFrame) cancelAnimationFrame(animFrame);
  const loop = () => {
    if(!video.paused && !video.ended) renderSource(video, true);
    animFrame = requestAnimationFrame(loop);
  };
  loop();
}

function loadFile(file) {
  if(!file) return;
  if(animFrame) cancelAnimationFrame(animFrame);

  currentFileName = file.name;
  sourceFile = file;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('canvasWrap').style.display = 'block';
  document.getElementById('glowRing').classList.add('active');
  document.getElementById('fileLoaded').style.display = 'block';
  document.getElementById('fileLoaded').textContent = file.name;
  document.getElementById('statFile').textContent = file.name;

  if(file.type.startsWith('image/')) {
    sourceType = 'image';
    const img = new Image();
    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      sourceImage = img;
      document.getElementById('statSize').textContent = `${img.naturalWidth}×${img.naturalHeight}`;
      renderSource(img, false);
      setExportReady(true, 'Export PNG');
    };
    img.src = URL.createObjectURL(file);

  } else if(file.type.startsWith('video/')) {
    sourceType = 'video';
    sourceImage = null;
    video.src = URL.createObjectURL(file);
    video.load();
    video.onloadeddata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      document.getElementById('statSize').textContent = `${video.videoWidth}×${video.videoHeight}`;
      video.play();
      startVideoLoop();
      setExportReady(true, 'Export Video');
    };
  }
}

function rerender() {
  if(sourceType === 'image' && sourceImage) renderSource(sourceImage, false);
}

// File input
document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });

// Sliders
const sliders = [
  {id:'dotSize', lbl:'vDotSize', fmt: v => v+'px'},
  {id:'angle', lbl:'vAngle', fmt: v => v+'°'},
  {id:'brightness', lbl:'vBrightness', fmt: v => v+'%'},
  {id:'contrast', lbl:'vContrast', fmt: v => v+'%'},
  {id:'blur', lbl:'vBlur', fmt: v => v+'px'},
  {id:'cutoff', lbl:'vCutoff', fmt: v => v+'%'},
];
sliders.forEach(s => {
  const el = document.getElementById(s.id);
  const lbl = document.getElementById(s.lbl);
  el.addEventListener('input', () => { lbl.textContent = s.fmt(el.value); rerender(); });
});

['colShadow','colMid','colHighlight'].forEach(id => {
  document.getElementById(id).addEventListener('input', rerender);
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPreset = btn.dataset.preset;
    document.getElementById('statPreset').textContent = currentPreset;
    document.getElementById('customColors').style.opacity = currentPreset === 'custom' ? '1' : '0.4';
    rerender();
  });
});

document.getElementById('customColors').style.opacity = '0.4';

function toggleBg() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('bgToggle').textContent = isLight ? 'Dark BG' : 'Light BG';
  rerender();
}
</script>
</body>
</html>
