<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volumetric Hologram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background: transparent;
    width:100vw; height:100vh;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace;
  }

  /* ── Upload ── */
  #upload-screen {
    position:fixed; inset:0; background:#efefec;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:300; gap:20px;
  }
  #upload-screen h1 { color:rgba(40,30,10,0.5); font-size:11px; letter-spacing:6px; text-transform:uppercase; }
  #drop-zone {
    width:360px; height:190px;
    border:1px solid rgba(40,30,10,0.2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; cursor:pointer; color:rgba(40,30,10,0.35); font-size:10px;
    letter-spacing:3px; text-align:center; position:relative; transition:all 0.2s;
    background:rgba(255,255,255,0.2);
  }
  #drop-zone:hover, #drop-zone.over { border-color:rgba(40,30,10,0.4); background:rgba(255,255,255,0.3); }
  #drop-zone .icon { font-size:36px; opacity:0.2; }
  #file-input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  #prog-wrap { width:360px; height:1px; background:rgba(40,30,10,0.1); display:none; }
  #prog-bar  { height:100%; width:0%; background:rgba(40,30,10,0.4); transition:width 0.2s; }
  #hint { color:rgba(40,30,10,0.25); font-size:8px; letter-spacing:3px; }
  #err-msg { color:#800; font-size:9px; letter-spacing:2px; display:none; text-align:center; max-width:360px; }

  /* ── Scene ── */
  #scene {
    position:relative;
    width:100vw; height:100vh;
    display:block;
  }

  /* ── Avatar wrapper — face + emitter together ── */
  #avatar-wrapper {
    position:absolute;
    width:460px; height:700px;
    left:50%; top:50%;
    transform:translate(-50%, -50%) scale(0.75);
    transform-origin: 50% 50%;
    display:flex; flex-direction:column;
    align-items:center;
  }

  /* ── Face section ── */
  #face-section {
    position:relative;
    width:460px; height:500px;
    flex-shrink:0;
    opacity: 0;
    isolation: isolate;
    overflow: hidden;
    clip-path: inset(100% 0 0 0);
    background: transparent;
    -webkit-mask-image: radial-gradient(ellipse 50% 54% at 50% 42%, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 78%);
    mask-image: radial-gradient(ellipse 50% 54% at 50% 42%, rgba(0,0,0,1) 52%, rgba(0,0,0,0) 78%);
  }

  #face-section.is-revealing {
    animation: holo-reveal 1.6s cubic-bezier(0.25, 0.9, 0.2, 1) forwards;
  }

  #face-section.is-revealed {
    opacity: 1;
    clip-path: inset(0 0 0 0);
  }

  #face-section.is-glitching #head-stack {
    animation: holo-glitch 0.5s steps(2, end) infinite;
  }

  @keyframes holo-reveal {
    from { opacity: 0; clip-path: inset(100% 0 0 0); }
    to { opacity: 1; clip-path: inset(0 0 0 0); }
  }

  @keyframes holo-glitch {
    0% { opacity: 0; }
    15% { opacity: 1; }
    35% { opacity: 0.2; }
    55% { opacity: 1; }
    75% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Subtle fallback glow if video fails */
  #face-section::before {
    content: "";
    position: absolute;
    inset: 12% 18% 30% 18%;
    border-radius: 50%;
    background: none;
    opacity: 0;
  }

  /* Perspective container for 3D stack */
  #face-pivot {
    position:absolute; inset:0;
    perspective:550px;
    perspective-origin:50% 42%;
    z-index: 2;
  }

  #head-stack {
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform-origin:50% 42%;
    will-change:transform;
    opacity: 0;
  }

  .layer {
    position:absolute; inset:0;
    transform-style:preserve-3d;
  }

  .layer video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
    display:block;
    filter: none;
    mix-blend-mode: screen;
    background: transparent;
  }

  /* Face scanlines */
  #face-scanlines {
    display: none;
  }

  #face-scanlines::after {
    display: none;
  }

  @keyframes holo-scan {
    from { transform: translateY(30.5%); }
    to { transform: translateY(0%); }
  }

  #face-tint {
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:25;
    display: none;
  }

  #face-halftone {
    display: none;
  }

  /* Face oval mask */
  #face-mask {
    position:absolute; inset:-60px;
    pointer-events:none; z-index:30;
    background: radial-gradient(
      ellipse 48% 52% at 50% 42%,
      rgba(239,239,236,0) 58%,
      rgba(239,239,236,0.35) 76%,
      rgba(239,239,236,0.7) 88%
    );
    opacity: 0;
  }

  /* ── Emitter section — matches reference CSS exactly ── */
  #emitter-section {
    position:relative;
    width:460px; height:180px;
    flex-shrink:0;
    margin-top:-90px;
    display:flex; align-items:flex-start; justify-content:center;
  }

  #emitter-section.is-booting {
    animation: emitter-boot 0.7s ease-in-out infinite;
  }

  @keyframes emitter-boot {
    0% { transform: translateX(0); }
    25% { transform: translateX(10px); }
    50% { transform: translateX(-10px); }
    75% { transform: translateX(6px); }
    100% { transform: translateX(0); }
  }

  #emitter {
    position:relative;
    /* Reference: width:100px but we scale up proportionally */
    width:150px; height:220px;
    will-change:transform;
    /* Reference: transform-origin 50% 100% — pivots from BOTTOM */
    transform-origin: 50% 100%;
    /* Reference: transition on transform */
    transition: none;

    /* Reference: clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%) */
    clip-path: polygon(0% 0%, 100% 0%, 60% 100%, 40% 100%);

    /* Emitter base tint */
    background-color: rgba(211, 12, 174, 0.4);

    /* Base edge */
    border-bottom: 3px solid rgba(211, 12, 174, 0.85);

    /* Reference: mask-image: linear-gradient(transparent, rgba(0,0,0,0.85))
       Mask goes FROM transparent (top) TO visible (bottom)
       So the top fades in and bottom is solid — inverted from what I had */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 100%);

    /* Reference: opacity 0.35 — very subtle overall */
    opacity: 0.35;

    overflow: hidden;
  }

  /* Canvas for animated scanlines + glitch on top of solid bg */
  #emitter-canvas {
    position:absolute; inset:0;
    width:100%; height:100%;
    mix-blend-mode: screen;
  }

  /* HUD */
  #reset-btn {
    position:fixed; top:14px; right:14px; z-index:100;
    background:none; border:1px solid rgba(40,30,10,0.18);
    color:rgba(40,30,10,0.35); font-family:'Courier New',monospace;
    font-size:8px; letter-spacing:2px; padding:5px 10px;
    cursor:pointer; display:none; text-transform:uppercase; transition:all 0.15s;
  }
  #reset-btn:hover { border-color:rgba(40,30,10,0.5); color:rgba(40,30,10,0.7); }
</style>
</head>
<body>

<!-- Upload screen hidden — auto-loads from images/head.webm -->
<div id="upload-screen" style="display:none"></div>

<div id="scene">
  <div id="avatar-wrapper">

    <!-- Face -->
    <div id="face-section">
      <div id="face-halftone"></div>
      <div id="face-pivot">
        <div id="head-stack"></div>
      </div>
      <div id="face-tint"></div>
      <div id="face-scanlines"></div>
      <div id="face-mask"></div>
    </div>

    <!-- Emitter trapezoid beam -->
    <div id="emitter-section">
      <div id="emitter">
        <canvas id="emitter-canvas" width="260" height="210"></canvas>
      </div>
    </div>

  </div>
</div>

<button id="reset-btn" onclick="doReset()">↩ NEW VIDEO</button>

<script>
const N      = 8;
const EASE   = 0.14;
const MAX_Y  = 20;
const MAX_X  = 14;
const Z_STEP = 28;
const HEAD_SCALE = 1.08;
const OPACITIES = [1.0, 0.7, 0.5, 0.35, 0.25, 0.18, 0.12, 0.08];

const uploadScr   = document.getElementById('upload-screen');
const sceneEl     = document.getElementById('scene');
const headStack   = document.getElementById('head-stack');
const emitter     = document.getElementById('emitter');
const fileInput   = document.getElementById('file-input');
const dropZone    = document.getElementById('drop-zone');
const progWrap    = document.getElementById('prog-wrap');
const progBar     = document.getElementById('prog-bar');
const errMsg      = document.getElementById('err-msg');
const resetBtn    = document.getElementById('reset-btn');

let layerVids = [], blobUrl = null, running = false;
let rotX = 0, rotY = 0;
let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;

// ── Load video ────────────────────────────────────────────────────────────
function loadVideo(file) {
  cleanup();
  blobUrl = URL.createObjectURL(file);

  let launched = false, readyCnt = 0;

  for (let i = 0; i < N; i++) {
    const div = document.createElement('div');
    div.className = 'layer';
    div.style.transform = `translateZ(${-i * Z_STEP}px)`;

    const v = document.createElement('video');
    v.src = blobUrl;
    v.muted = true;
    v.loop = true;
    v.autoplay = true;
    v.playsInline = true;
    v.preload = 'auto';
    v.setAttribute('muted', '');
    v.setAttribute('autoplay', '');
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.style.opacity = String(OPACITIES[i]);
    v.style.filter = 'none';
    v.style.mixBlendMode = 'screen';

    div.appendChild(v);
    headStack.appendChild(div);
    layerVids.push(v);

    v.addEventListener('canplay',    () => {
      readyCnt++;
      if (progBar) progBar.style.width = Math.min(90, 10 + readyCnt * 11) + '%';
      if (!launched) { launched = true; launch(); }
    }, { once:true });
    v.addEventListener('loadeddata', () => { if (!launched) { launched=true; launch(); } }, { once:true });
    v.addEventListener('error',      () => {
      const c=v.error?v.error.code:'?';
      const m={1:'ABORTED',2:'NETWORK',3:'DECODE ERROR',4:'FORMAT NOT SUPPORTED'};
      showErr('✗ '+(m[c]||'ERROR')+' — code '+c);
    }, { once:true });
    v.load();
  }
  setTimeout(() => { if (!launched) { launched=true; launch(); } }, 5000);
}

function launch() {
  if (progBar) progBar.style.width = '100%';
  layerVids.forEach(v => { v.currentTime=0; v.play().catch(()=>{}); });
  setTimeout(() => {
    if (uploadScr) uploadScr.style.display = 'none';
    sceneEl.style.display   = 'block';
    const faceEl = document.getElementById('face-section');
    const emitterSection = document.getElementById('emitter-section');

    if (faceEl) {
      faceEl.classList.remove('is-revealing', 'is-revealed', 'is-glitching');
      faceEl.style.opacity = '0';
    }
    if (headStack) headStack.style.opacity = '0';

    if (emitterSection) emitterSection.classList.add('is-booting');
    if (!emitterRunning) {
      emitterRunning = true;
      requestAnimationFrame(emitterLoop);
    }

    const revealDuration = 1600;
    const glitchDuration = 500;

    setTimeout(() => {
      if (emitterSection) emitterSection.classList.remove('is-booting');
      if (faceEl) faceEl.classList.add('is-revealing');
      setTimeout(() => {
        if (faceEl) faceEl.classList.add('is-glitching');
        if (headStack) headStack.style.opacity = '1';
        running = true;
        requestAnimationFrame(tick);
        setTimeout(() => {
          if (faceEl) {
            faceEl.classList.add('is-revealed');
            faceEl.classList.remove('is-revealing', 'is-glitching');
            faceEl.style.opacity = '1';
          }
          if (headStack) headStack.style.opacity = '1';
          if (window.parent) {
            window.parent.postMessage({ type: 'holo-ready' }, '*');
          }
        }, glitchDuration);
      }, revealDuration);
    }, 750);
  }, 150);
}

// ── Flicker intro — simulates hologram powering on ───────────────────────
function startFlickerIntro(onComplete) {
  const stack = document.getElementById('head-stack');
  const faceEl = document.getElementById('face-section');
  const emitterEl = document.getElementById('emitter');

  // Flicker sequence: [opacity, duration_ms]
  const seq = [
    [0.0,  60],
    [0.9,  40],
    [0.0,  80],
    [0.6,  30],
    [0.0,  60],
    [1.0,  50],
    [0.0,  40],
    [0.8,  60],
    [0.2,  30],
    [1.0,  40],
    [0.0,  50],
    [0.7,  30],
    [0.0,  40],
    [1.0,  60],
    [0.3,  20],
    [1.0,  80],
    [0.0,  30],
    [1.0, 120],  // settle
  ];

  let i = 0;
  if (!emitterRunning) {
    emitterRunning = true;
    requestAnimationFrame(emitterLoop); // emitter flickers on too
  }

  function step() {
    if (i >= seq.length) {
      if (faceEl) faceEl.style.opacity = '1';
      stack.style.opacity    = '1';
      emitterEl.style.opacity = '0.35';
      if (window.parent) {
        window.parent.postMessage({ type: 'holo-ready' }, '*');
      }
      onComplete();
      return;
    }
    const [op, dur] = seq[i++];
    if (faceEl) faceEl.style.opacity = String(op);
    stack.style.opacity     = String(op);
    emitterEl.style.opacity  = String(op * 0.35);
    setTimeout(step, dur);
  }
  step();
}

// ── Emitter always-on loop — independent of mouse movement ───────────────
let emitterRunning = false;
function emitterLoop() {
  if (!emitterRunning) return;
  drawEmitter();
  requestAnimationFrame(emitterLoop);
}

function showErr(msg) {
  if (errMsg) { errMsg.textContent = msg; errMsg.style.display = 'block'; }
  if (progWrap) progWrap.style.display = 'none';
}

// ── Sync ──────────────────────────────────────────────────────────────────
setInterval(() => {
  if (!running || !layerVids[0]) return;
  const t = layerVids[0].currentTime;
  for (let i=1; i<N; i++) {
    const v=layerVids[i];
    if (v && v.readyState>=2 && Math.abs(v.currentTime-t)>0.12) v.currentTime=t;
  }
}, 400);

// ── Glitch ────────────────────────────────────────────────────────────────
let lastGlitch = 0;
function glitch(ts) {
  if (ts - lastGlitch < 2000 + Math.random()*3000) return;
  lastGlitch = ts;
  const picks=[];
  while (picks.length<2) { const r=1+Math.floor(Math.random()*(N-1)); if (!picks.includes(r)) picks.push(r); }
  picks.forEach(i => {
    const v=layerVids[i]; if (!v) return;
    v.style.transform=`translate(${(Math.random()-.5)*28}px,0)`;
    setTimeout(()=>{ if(v) v.style.transform=''; }, 55+Math.random()*80);
  });
}

// ── Mouse ─────────────────────────────────────────────────────────────────
document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; });
document.addEventListener('touchmove', e => { mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; }, {passive:true});

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || data.type !== 'holo-pointer') return;
  if (typeof data.nx !== 'number' || typeof data.ny !== 'number') return;
  mouseX = data.nx * window.innerWidth;
  mouseY = data.ny * window.innerHeight;
});

// ── Tick ──────────────────────────────────────────────────────────────────
function tick(ts) {
  if (!running) return;
  requestAnimationFrame(tick);
  glitch(ts);

  // Get face center
  const facePivotEl = document.getElementById('face-pivot');
  const r  = facePivotEl.getBoundingClientRect();
  const cx = r.left + r.width  * 0.5;
  const cy = r.top  + r.height * 0.42;

  const dx = (mouseX - cx) / (window.innerWidth  * 0.44);
  const dy = (mouseY - cy) / (window.innerHeight * 0.44);
  const d  = Math.sqrt(dx*dx + dy*dy);
  const k  = Math.min(d * 1.4, 1.0);

  const tY =  dx * MAX_Y * k;
  const tX = -dy * MAX_X * k;

  rotX += (tX - rotX) * EASE;
  rotY += (tY - rotY) * EASE;

  // Rotate the 3D face stack
  headStack.style.transform = `scale(${HEAD_SCALE}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;

  // Emitter: reference uses scaleY(0.65) base + slight rotate from mouse
  // transform-origin is 50% 100% (bottom) so it tilts from base
  // We add a small rotate() matching horizontal mouse offset
  const emitRotate = rotY * 0.1; // stronger tilt to match head rotation
  emitter.style.transform = `rotate(${emitRotate}deg)`;
}

// ── Emitter canvas renderer ───────────────────────────────────────────────
// Canvas overlays animated scanlines + glitch on top of the solid CSS bg
const emitterCanvas = document.getElementById('emitter-canvas');
const eCtx = emitterCanvas.getContext('2d');
const EW = 150, EH = 220;
emitterCanvas.width  = EW;
emitterCanvas.height = EH;

// Scanline state — each line independent speed, opacity, glitch
const NUM_LINES = 40;
const elines = Array.from({length: NUM_LINES}, (_, i) => ({
  y:           (i / NUM_LINES) * EH,
  speed:       0.5 + Math.random() * 1.0,
  opacity:     0.3 + Math.random() * 0.5,
  glitchX:     0,
  glitchTimer: 0,
  tone:        (i % 5 === 0) ? 'yellow' : 'pink',
}));

let emitterTime = 0;

function drawEmitter() {
  emitterTime += 0.016;
  eCtx.clearRect(0, 0, EW, EH);

  // ── Scanlines: scroll upward (emitting upward toward face) ──
  elines.forEach(ln => {
    ln.y -= ln.speed; // move UP — projecting toward the face
    if (ln.y < -2) {
      ln.y       = EH + 2;
      ln.speed   = 0.5 + Math.random() * 1.0;
      ln.opacity = 0.25 + Math.random() * 0.5;
      ln.glitchX = 0;
      ln.tone    = (Math.random() < 0.25) ? 'yellow' : 'pink';
    }

    // Glitch: random horizontal snap
    if (ln.glitchTimer > 0) {
      ln.glitchTimer--;
    } else if (Math.random() < 0.005) {
      ln.glitchX     = (Math.random() - 0.5) * 22;
      ln.glitchTimer = 2 + Math.floor(Math.random() * 6);
    } else {
      ln.glitchX *= 0.85; // smooth return
    }

    // Fade: lines near top (close to face) = more visible
    // lines near bottom = fade out (matches mask: transparent top → solid bottom
    // but we want scanlines visible more at top where they project from)
    const t         = ln.y / EH; // 0=top, 1=bottom
    const lineFade  = Math.max(0, 1 - t * 1.1); // brighter at top
    if (lineFade <= 0.01) return;

    const alpha = ln.opacity * lineFade;

    // Full width of canvas (clip-path on parent handles trapezoid shape)
    const x1 = ln.glitchX;
    const x2 = EW + ln.glitchX;

    // Horizontal glow — bright center, fade edges
    const grad = eCtx.createLinearGradient(x1, 0, x2, 0);
    if (ln.tone === 'yellow') {
      grad.addColorStop(0,    `rgba(245,195,118,0)`);
      grad.addColorStop(0.18, `rgba(245,195,118,${alpha * 0.7})`);
      grad.addColorStop(0.5,  `rgba(255,214,138,${alpha})`);
      grad.addColorStop(0.82, `rgba(245,195,118,${alpha * 0.7})`);
      grad.addColorStop(1,    `rgba(245,195,118,0)`);
    } else {
      grad.addColorStop(0,    `rgba(211,12,174,0)`);
      grad.addColorStop(0.18, `rgba(211,12,174,${alpha * 0.7})`);
      grad.addColorStop(0.5,  `rgba(236,86,184,${alpha})`);
      grad.addColorStop(0.82, `rgba(211,12,174,${alpha * 0.7})`);
      grad.addColorStop(1,    `rgba(211,12,174,0)`);
    }

    eCtx.strokeStyle = grad;
    eCtx.lineWidth   = 1;
    eCtx.beginPath();
    eCtx.moveTo(x1, ln.y);
    eCtx.lineTo(x2, ln.y);
    eCtx.stroke();
  });

  // ── Pulse wave scrolling upward — bright energy band ──
  const pulseY = EH - ((emitterTime * 55) % (EH + 30));
  const pAlpha = Math.max(0, (pulseY / EH)); // brighter when higher up
  const pulseGrad = eCtx.createLinearGradient(0, pulseY - 10, 0, pulseY + 10);
  pulseGrad.addColorStop(0,   'rgba(211,12,174,0)');
  pulseGrad.addColorStop(0.5, `rgba(236,86,184,${0.22 * pAlpha})`);
  pulseGrad.addColorStop(1,   'rgba(211,12,174,0)');
  eCtx.fillStyle = pulseGrad;
  eCtx.fillRect(0, pulseY - 10, EW, 20);
}

if (!emitterRunning) {
  emitterRunning = true;
  requestAnimationFrame(emitterLoop);
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function cleanup() {
  running = false;
  layerVids.forEach(v => { try { v.pause(); v.src=''; v.parentNode&&v.parentNode.remove(); } catch(e){} });
  layerVids = [];
  while (headStack.firstChild) headStack.removeChild(headStack.firstChild);
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl=null; }
  rotX=rotY=0;
  headStack.style.transform='';
  emitter.style.transform='';
  emitterRunning = false;
  eCtx.clearRect(0,0,EW,EH);
}

function doReset() {
  cleanup();
  sceneEl.style.display = 'none';
  if (resetBtn) resetBtn.style.display = 'none';
  if (uploadScr) uploadScr.style.display = 'flex';
  if (progWrap) progWrap.style.display = 'none';
  if (progBar) progBar.style.width = '0%';
  if (errMsg) errMsg.style.display = 'none';
  if (fileInput) fileInput.value = '';
}

// Auto-load video
fetch('latestht.webm')
  .then(r => {
    if (!r.ok) throw new Error('Could not load hologram.webm');
    return r.blob();
  })
  .then(blob => loadVideo(blob))
  .catch(err => {
    console.error('Hologram load error:', err);
    sceneEl.style.display = 'block';
    emitterRunning = true;
    requestAnimationFrame(emitterLoop);
  });
</script>
</body>
</html>
